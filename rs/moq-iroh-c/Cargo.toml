[package]
name = "moq-iroh-c"
description = "Media over QUIC between iroh endpoints, as a small poll-driven C ABI"
authors = ["Johnneylee Jack Rollins <git@spacegho.st>"]
repository = "https://github.com/Spaceghost/moq"
license = "MIT OR Apache-2.0"

version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false

keywords = ["quic", "iroh", "media", "live", "ffi"]
categories = ["multimedia", "network-programming"]

[lib]
name = "moq_iroh"
# staticlib: linked into a host program (ghostty-agent) with no .so beside it.
# cdylib: for hosts that load it at run time.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
bytes = { workspace = true }
futures = { workspace = true }
moq-net = { workspace = true }
# Only the iroh transport: no noq/WebTransport/TCP listeners are compiled.
moq-tokio = { workspace = true, features = ["iroh"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }

[build-dependencies]
cbindgen = "0.29"

[dev-dependencies]
# The same iroh moq-tokio uses, with its in-process relay for the relay-to-direct test.
iroh = { version = "1.0.3", features = ["test-utils"] }
tempfile = { workspace = true }
